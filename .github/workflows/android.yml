name: Build HephaistOS APK & Native Toolchain

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-native-tools:
    name: Cross-Compile Native Rust Tools (GÉMÉAU Dissector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl, x86_64-unknown-linux-gnu

      - name: Install Cross for cross-compilation
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Compile gemeau-dissector (x86_64)
        run: |
          cd tools/gemeau-dissector
          cargo build --release
          mkdir -p ../../dist/tools/bin/x86_64
          cp target/release/gemeau-dissector ../../dist/tools/bin/x86_64/

      - name: Compile gemeau-dissector (ARM64 & ARMv7 via Cross/musl)
        run: |
          cd tools/gemeau-dissector
          cross build --target aarch64-unknown-linux-musl --release || cargo build --release
          mkdir -p ../../dist/tools/bin/arm64-v8a
          if [ -f target/aarch64-unknown-linux-musl/release/gemeau-dissector ]; then
            cp target/aarch64-unknown-linux-musl/release/gemeau-dissector ../../dist/tools/bin/arm64-v8a/gemeau-dissector
          else
            cp target/release/gemeau-dissector ../../dist/tools/bin/arm64-v8a/gemeau-dissector
          fi

      - name: Assemble Structured Tools Directory (/sdcard/HEPHAISTOS/TOOLS)
        run: |
          mkdir -p dist/tools/scripts dist/tools/profiles dist/tools/rules
          cp -r tools/scripts/* dist/tools/scripts/ 2>/dev/null || true
          cp -r tools/profiles/* dist/tools/profiles/ 2>/dev/null || true
          cp -r tools/rules/* dist/tools/rules/ 2>/dev/null || true
          
          # Copie des outils dans les assets de l'application Android pour auto-déploiement
          mkdir -p app/src/main/assets/tools/bin
          mkdir -p app/src/main/assets/tools/scripts
          mkdir -p app/src/main/assets/tools/profiles
          mkdir -p app/src/main/assets/tools/rules
          cp -r dist/tools/* app/src/main/assets/tools/

      - name: Package Native Tools Archive (sdcard/HEPHAISTOS/TOOLS bundle)
        run: |
          cd dist
          zip -r ../hephaistos-native-tools.zip tools/

      - name: Upload Native Tools Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HephaistOS-Native-Tools
          path: hephaistos-native-tools.zip
          retention-days: 14

  build-app:
    name: Build & Assemble Debug APK
    runs-on: ubuntu-latest
    needs: build-native-tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Native Tools Artifact
        uses: actions/download-artifact@v4
        with:
          name: HephaistOS-Native-Tools
          path: native-tools-dl/

      - name: Inject Pre-Compiled Native Tools into Android Assets
        run: |
          if [ -f native-tools-dl/hephaistos-native-tools.zip ]; then
            unzip -q native-tools-dl/hephaistos-native-tools.zip -d /tmp/tools_extracted/
            mkdir -p app/src/main/assets/tools
            cp -r /tmp/tools_extracted/tools/* app/src/main/assets/tools/
            echo "[+] Native tools injected into app/src/main/assets/tools/"
          fi

      - name: Set up Java JDK 21 (Required for AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi

      - name: Ensure environment configuration (.env)
        run: |
          touch .env
          if [ -f .env.example ]; then
            cat .env.example >> .env
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Compile Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HephaistOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
